<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตามอะไหล่ & ซ่อมบำรุง</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', 'Segoe UI', sans-serif;
    background: #f0f4f8;
    color: #1e293b;
    min-height: 100vh;
  }
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #1e3a5f;
    --primary-light: #2d5f9e;
    --accent: #e67e22;
    --success: #27ae60;
    --warning: #f39c12;
    --danger: #e74c3c;
    --info: #2980b9;
    --surface: #ffffff;
    --bg: #f0f4f8;
    --border: #d1dbe8;
    --text: #1e293b;
    --text-muted: #64748b;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    --radius: 10px;
  }

  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(30,58,95,0.3);
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header p { font-size: 13px; opacity: 0.75; margin-top: 2px; }
  .header-actions { display: flex; gap: 10px; }
  .btn {
    padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500;
    cursor: pointer; border: none; transition: all 0.2s;
    font-family: inherit;
  }
  .btn-white { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }
  .btn-white:hover { background: rgba(255,255,255,0.3); }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { background: #d35400; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: #c0392b; }
  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: #219a52; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px 20px; box-shadow: var(--shadow);
    border-left: 4px solid transparent;
    transition: transform 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-card.total { border-color: var(--primary-light); }
  .stat-card.waiting { border-color: var(--warning); }
  .stat-card.ordered { border-color: var(--info); }
  .stat-card.received { border-color: var(--success); }
  .stat-card.done { border-color: #8e44ad; }
  .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 700; }
  .stat-card.total .stat-value { color: var(--primary-light); }
  .stat-card.waiting .stat-value { color: var(--warning); }
  .stat-card.ordered .stat-value { color: var(--info); }
  .stat-card.received .stat-value { color: var(--success); }
  .stat-card.done .stat-value { color: #8e44ad; }

  .toolbar {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px 20px; box-shadow: var(--shadow);
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    margin-bottom: 20px;
  }
  .toolbar input, .toolbar select {
    padding: 8px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: var(--bg); color: var(--text);
    transition: border-color 0.2s;
    outline: none;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--primary-light); }
  .toolbar input { flex: 1; min-width: 200px; }
  .spacer { flex: 1; }

  .tabs { display: flex; gap: 4px; margin-bottom: 0; }
  .tab {
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1.5px solid var(--border); background: var(--bg);
    color: var(--text-muted); transition: all 0.2s; font-family: inherit;
  }
  .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
  .tab:hover:not(.active) { background: var(--border); }

  .table-card {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: #f8fafc; }
  th {
    padding: 12px 14px; text-align: left; font-weight: 600;
    color: var(--text-muted); font-size: 12px; text-transform: uppercase;
    border-bottom: 2px solid var(--border); white-space: nowrap;
  }
  td {
    padding: 11px 14px; border-bottom: 1px solid #f0f4f8;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }
  tr.highlight-row td { background: #fef9ec; }

  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge-waiting { background: #fef3c7; color: #92400e; }
  .badge-quotation { background: #dbeafe; color: #1e40af; }
  .badge-ordered { background: #ede9fe; color: #4c1d95; }
  .badge-received { background: #dcfce7; color: #14532d; }
  .badge-installed { background: #d1fae5; color: #064e3b; }
  .badge-memo { background: #ffedd5; color: #9a3412; }
  .badge-default { background: #f1f5f9; color: #475569; }

  .zone-badge {
    display: inline-block; width: 26px; height: 26px; border-radius: 50%;
    text-align: center; line-height: 26px; font-size: 11px; font-weight: 700;
  }
  .zone-A { background: #dbeafe; color: #1e40af; }
  .zone-B { background: #dcfce7; color: #14532d; }
  .zone-C { background: #fef3c7; color: #92400e; }
  .zone-PFD { background: #fce7f3; color: #831843; font-size: 9px; }
  .zone-All { background: #f0f4f8; color: #475569; font-size: 9px; }

  .action-btns { display: flex; gap: 5px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--bg); border-color: var(--primary-light); }
  .icon-btn.del:hover { background: #fef2f2; border-color: var(--danger); }

  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 14px;
    width: 90%; max-width: 680px; max-height: 90vh;
    overflow-y: auto; box-shadow: var(--shadow-lg);
    padding: 28px;
  }
  .modal h2 {
    font-size: 18px; font-weight: 700; color: var(--primary);
    margin-bottom: 24px; padding-bottom: 14px;
    border-bottom: 2px solid var(--bg);
    display: flex; align-items: center; gap: 10px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .form-group input, .form-group select, .form-group textarea {
    padding: 9px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
    color: var(--text); background: var(--bg); outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--primary-light);
    background: var(--surface);
  }
  .form-group textarea { min-height: 80px; resize: vertical; }
  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end;
    margin-top: 24px; padding-top: 16px;
    border-top: 1px solid var(--bg);
  }
  .btn-cancel { background: var(--bg); color: var(--text-muted); border: 1.5px solid var(--border); }
  .btn-cancel:hover { background: var(--border); }

  .confirm-modal { max-width: 400px; text-align: center; }
  .confirm-modal .icon { font-size: 48px; margin-bottom: 12px; }
  .confirm-modal p { color: var(--text-muted); margin-bottom: 20px; font-size: 15px; }

  .pagination {
    display: flex; align-items: center; justify-content: between;
    padding: 14px 20px; border-top: 1px solid var(--border);
    gap: 12px; flex-wrap: wrap;
  }
  .page-info { font-size: 13px; color: var(--text-muted); flex: 1; }
  .page-btns { display: flex; gap: 4px; }
  .page-btn {
    width: 32px; height: 32px; border-radius: 6px; border: 1.5px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 13px; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); transition: all 0.2s;
  }
  .page-btn:hover:not(:disabled) { background: var(--primary); color: white; border-color: var(--primary); }
  .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  .page-btn:disabled { opacity: 0.4; cursor: default; }

  .export-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text); font-family: inherit; transition: all 0.2s;
  }
  .export-btn:hover { background: var(--bg); border-color: var(--primary-light); }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--text); color: white;
    padding: 12px 20px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-lg);
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s; z-index: 9999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  .pr-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .pr-chip {
    background: #ede9fe; color: #4c1d95;
    font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500;
  }

  @media (max-width: 768px) {
    .header { flex-direction: column; gap: 12px; align-items: flex-start; }
    .form-grid { grid-template-columns: 1fr; }
    .container { padding: 16px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon">⚙️</div>
    <div>
      <h1>ระบบติดตามอะไหล่ & ซ่อมบำรุงเครื่องจักร</h1>
      <p>Spare Parts & Maintenance Tracking System</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-white export-btn" onclick="exportCSV()">📤 Export CSV</button>
    <button class="btn btn-accent" onclick="openAddModal()">＋ เพิ่มรายการใหม่</button>
  </div>
</div>

<div class="container">

  <div class="stats-grid" id="statsGrid"></div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 ค้นหา เครื่องจักร / ปัญหา / MEMO/PR ..." oninput="applyFilters()">
    <select id="filterZone" onchange="applyFilters()">
      <option value="">ทุกโซน</option>
      <option value="A">โซน A</option>
      <option value="B">โซน B</option>
      <option value="C">โซน C</option>
      <option value="PFD">PFD</option>
      <option value="All">All</option>
    </select>
    <select id="filterStatus" onchange="applyFilters()">
      <option value="">ทุกสถานะ</option>
      <option value="รอดำเนินการ">รอดำเนินการ</option>
      <option value="ขอใบเสนอราคา">ขอใบเสนอราคา</option>
      <option value="MEMO">MEMO</option>
      <option value="สั่งซื้อแล้ว">สั่งซื้อแล้ว</option>
      <option value="รับอะไหล่แล้ว">รับอะไหล่แล้ว</option>
      <option value="ติดตั้งแล้ว">ติดตั้งแล้ว</option>
    </select>
    <select id="filterResponsible" onchange="applyFilters()">
      <option value="">ผู้รับผิดชอบทั้งหมด</option>
    </select>
    <div class="spacer"></div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('MNT', this)">📋 MNT</button>
      <button class="tab" onclick="switchTab('May2026', this)">📅 May 2026</button>
      <button class="tab" onclick="switchTab('June2026', this)">📅 June 2026</button>
    </div>
  </div>

  <div class="table-card">
    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="icon">🔍</div>
      <p>ไม่พบรายการที่ตรงกับเงื่อนไขค้นหา</p>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h2 id="modalTitle">➕ เพิ่มรายการใหม่</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>เครื่องจักร *</label>
        <input type="text" id="f_machine" placeholder="เช่น M64, Cupo tech">
      </div>
      <div class="form-group">
        <label>โซน</label>
        <select id="f_zone">
          <option value="">-- เลือกโซน --</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="PFD">PFD</option>
          <option value="All">All</option>
        </select>
      </div>
      <div class="form-group">
        <label>Product Item</label>
        <input type="text" id="f_product" placeholder="เช่น PC 16 oz, IT130 ml">
      </div>
      <div class="form-group">
        <label>Supplier</label>
        <input type="text" id="f_supplier" placeholder="เช่น PSW, Cupo tech, KBA">
      </div>
      <div class="form-group full">
        <label>ปัญหา *</label>
        <textarea id="f_problem" placeholder="อธิบายปัญหาที่พบ..."></textarea>
      </div>
      <div class="form-group full">
        <label>แนวทางแก้ไข</label>
        <textarea id="f_solution" placeholder="วิธีการแก้ไข / อะไหล่ที่ต้องสั่ง..."></textarea>
      </div>
      <div class="form-group">
        <label>MEMO/PR</label>
        <input type="text" id="f_pr" placeholder="เช่น PR26-0081, PR25-2338">
      </div>
      <div class="form-group">
        <label>Budget (บาท)</label>
        <input type="number" id="f_budget" placeholder="0">
      </div>
      <div class="form-group">
        <label>สถานะ</label>
        <select id="f_status">
          <option value="รอดำเนินการ">รอดำเนินการ</option>
          <option value="ขอใบเสนอราคา">ขอใบเสนอราคา</option>
          <option value="MEMO">MEMO</option>
          <option value="สั่งซื้อแล้ว">สั่งซื้อแล้ว</option>
          <option value="รับอะไหล่แล้ว">รับอะไหล่แล้ว</option>
          <option value="ติดตั้งแล้ว">ติดตั้งแล้ว</option>
        </select>
      </div>
      <div class="form-group">
        <label>ผู้รับผิดชอบ</label>
        <input type="text" id="f_responsible" placeholder="เช่น ปราโมทย์, อณุชิด">
      </div>
      <div class="form-group">
        <label>กำหนดการ</label>
        <input type="date" id="f_deadline">
      </div>
      <div class="form-group">
        <label>ระยะเวลาแก้ไข</label>
        <input type="text" id="f_duration" placeholder="เช่น 10 วัน, 30 วัน">
      </div>
      <div class="form-group full">
        <label>หมายเหตุ (Remark)</label>
        <textarea id="f_remark" placeholder="ข้อมูลเพิ่มเติม..." style="min-height:60px;"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-success" onclick="saveRecord()">💾 บันทึก</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal confirm-modal">
    <div class="icon">🗑️</div>
    <h2 style="justify-content:center;">ยืนยันการลบ</h2>
    <p>คุณต้องการลบรายการนี้ใช่ไหม?<br>การดำเนินการนี้ไม่สามารถย้อนกลับได้</p>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn btn-cancel" onclick="document.getElementById('confirmModal').classList.remove('open')">ยกเลิก</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">ลบรายการ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

    {id:16,machine:'M54',zone:'B',product:'IT95ml',problem:'สายพานขับเครื่องและลูกปืนสไลด์ชึดขมวดปาก M54',solution:'สายพานขับเครื่องและลูกปืนสไลด์ชึดขมวดปาก M54',supplier:'',budget:'',status:'รอดำเนินการ',pr:'PR26-0171',responsible:'ปราโมทย์',deadline:'',duration:'',remark:''},
    {id:17,machine:'M46',zone:'A',product:'PC22oz',problem:'สายพานลำเลียงเศษกระดาษก้น M46',solution:'สายพานลำเลียงเศษกระดาษก้น M46',supplier:'',budget:'',status:'รอดำเนินการ',pr:'PR26-0174',responsible:'ปราโมทย์',deadline:'',duration:'',remark:''},
    {id:18,machine:'M96',zone:'A',product:'PC16oz',problem:'ทำอะไหล่บูชเตาเป่าก้น M96',solution:'ทำอะไหล่บูชเตาเป่าก้น M96',supplier:'',budget:'',status:'รอดำเนินการ',pr:'PR26-0181',responsible:'ปราโมทย์',deadline:'',duration:'',remark:''},
    {id:19,machine:'M32',zone:'A',product:'PC16oz',problem:'ทำอะไหล่แหวนกั้นลมร้อนคอเตาเป่าก้นถ้วย M32',solution:'ทำอะไหล่แหวนกั้นลมร้อนคอเตาเป่าก้นถ้วย M32',supplier:'',budget:'',status:'รอดำเนินการ',pr:'PR26-0184',responsible:'ปราโมทย์',deadline:'',duration:'',remark:''},
    {id:20,machine:'M84',zone:'B',product:'IC130ml',problem:'Pressure switch ตัวเช็คลมออกจาก Blower M84',solution:'Pressure switch ตัวเช็คลมออกจาก Blower M84',supplier:'',budget:'',status:'รอดำเนินการ',pr:'PR26-0189',responsible:'ปราโมทย์',deadline:'',duration:'',remark:''},
    {id:21,machine:'M99',zone:'A',product:'PC22oz',problem:'ลูกปืนแขนรางสไลด์ชุดลำเลียงถ้อยออกจากโมลด์อาร์กข้าง M99',solution:'ลูกปืนแขนรางสไลด์ชุดลำเลียงถ้อยออกจากโมลด์อาร์กข้าง M99',supplier:'',budget:'',status:'รอดำเนินการ',pr:'PR26-0205',responsible:'ปราโมทย์',deadline:'',duration:'',remark:''},
    {id:22,machine:'M56',zone:'A',product:'PC10-12oz',problem:'ลูกปืน Cam Follower ผลักจังหวะใต้เครื่อง M56',solution:'ลูกปืน Cam Follower ผลักจังหวะใต้เครื่อง M56',supplier:'',budget:'',status:'รอดำเนินการ',pr:'PR26-0219',responsible:'ปราโมทย์',deadline:'',duration:'',remark:''},
    {id:23,machine:'Conven',zone:'PFD',product:'Conven',problem:'ซ่อมมอเตอร์ Reg.',solution:'',supplier:'',budget:'',status:'รอดำเนินการ',pr:'PR26-0213',responsible:'จักรเพชร',deadline:'',duration:'',remark:''},
  ],
  June2026: []
};

let data = {};
let currentTab = 'MNT';
let editId = null;
let deleteId = null;
let currentPage = 1;
const PAGE_SIZE = 15;
let filteredData = [];

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData));
    if (!data.June2026) data.June2026 = [];
  } catch(e) { data = JSON.parse(JSON.stringify(defaultData)); }
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function getNextId(tab) {
  const arr = data[tab];
  return arr.length ? Math.max(...arr.map(r => r.id)) + 1 : 1;
}

function getStatusBadge(s) {
  const m = {
    'รอดำเนินการ': 'badge-waiting',
    'ขอใบเสนอราคา': 'badge-quotation',
    'สั่งซื้อแล้ว': 'badge-ordered',
    'รับอะไหล่แล้ว': 'badge-received',
    'ติดตั้งแล้ว': 'badge-installed',
    'MEMO': 'badge-memo',
  };
  return `<span class="badge ${m[s] || 'badge-default'}">${s || '-'}</span>`;
}
function getZoneBadge(z) {
  if (!z) return '-';
  const cls = z.length <= 1 ? `zone-${z}` : `zone-${z}`;
  return `<span class="zone-badge zone-${z}">${z}</span>`;
}
function getPRChips(pr) {
  if (!pr) return '-';
  const chips = pr.split(/[,\n]+/).map(p => p.trim()).filter(p => p);
  return `<div class="pr-chips">${chips.map(p => `<span class="pr-chip">${p}</span>`).join('')}</div>`;
}
function formatDate(d) {
  if (!d) return '-';
  const parts = d.split('-');
  if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return d;
}

function updateStats() {
  const arr = data[currentTab] || [];
  const total = arr.length;
  const waiting = arr.filter(r => r.status === 'รอดำเนินการ').length;
  const quotation = arr.filter(r => r.status === 'ขอใบเสนอราคา' || r.status === 'MEMO').length;
  const ordered = arr.filter(r => r.status === 'สั่งซื้อแล้ว').length;
  const done = arr.filter(r => r.status === 'ติดตั้งแล้ว' || r.status === 'รับอะไหล่แล้ว').length;
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card total"><div class="stat-label">รายการทั้งหมด</div><div class="stat-value">${total}</div></div>
    <div class="stat-card waiting"><div class="stat-label">รอดำเนินการ</div><div class="stat-value">${waiting}</div></div>
    <div class="stat-card ordered"><div class="stat-label">ขอใบเสนอราคา / MEMO</div><div class="stat-value">${quotation}</div></div>
    <div class="stat-card received"><div class="stat-label">สั่งซื้อแล้ว</div><div class="stat-value">${ordered}</div></div>
    <div class="stat-card done"><div class="stat-label">รับ / ติดตั้งแล้ว</div><div class="stat-value">${done}</div></div>
  `;
}

function updateResponsibleFilter() {
  const arr = data[currentTab] || [];
  const persons = [...new Set(arr.map(r => r.responsible).filter(Boolean))].sort();
  const sel = document.getElementById('filterResponsible');
  const cur = sel.value;
  sel.innerHTML = '<option value="">ผู้รับผิดชอบทั้งหมด</option>' + persons.map(p => `<option value="${p}" ${p===cur?'selected':''}>${p}</option>`).join('');
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const zone = document.getElementById('filterZone').value;
  const status = document.getElementById('filterStatus').value;
  const responsible = document.getElementById('filterResponsible').value;
  filteredData = (data[currentTab] || []).filter(r => {
    const matchSearch = !search || [r.machine, r.problem, r.solution, r.pr, r.product, r.responsible].some(v => (v||'').toLowerCase().includes(search));
    const matchZone = !zone || r.zone === zone;
    const matchStatus = !status || r.status === status;
    const matchRes = !responsible || r.responsible === responsible;
    return matchSearch && matchZone && matchStatus && matchRes;
  });
  currentPage = 1;
  renderTable();
}

function renderTable() {
  const cols = ['#','เครื่องจักร','โซน','Product Item','ปัญหา','แนวทางแก้ไข','สถานะ','MEMO/PR','ผู้รับผิดชอบ','กำหนดการ','จัดการ'];
  document.getElementById('tableHead').innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;

  const total = filteredData.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > pages) currentPage = pages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageData = filteredData.slice(start, start + PAGE_SIZE);

  const tbody = document.getElementById('tableBody');
  if (!pageData.length) {
    tbody.innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';

  tbody.innerHTML = pageData.map((r, i) => `
    <tr>
      <td style="color:var(--text-muted);font-size:12px;">${start + i + 1}</td>
      <td style="font-weight:600;white-space:nowrap;">${r.machine||'-'}</td>
      <td>${getZoneBadge(r.zone)}</td>
      <td style="font-size:12px;color:var(--text-muted);">${r.product||'-'}</td>
      <td style="max-width:200px;">${r.problem||'-'}</td>
      <td style="max-width:200px;font-size:12px;">${r.solution||'-'}</td>
      <td>${getStatusBadge(r.status)}</td>
      <td>${getPRChips(r.pr)}</td>
      <td style="white-space:nowrap;">${r.responsible||'-'}</td>
      <td style="white-space:nowrap;font-size:12px;">${formatDate(r.deadline)}</td>
      <td>
        <div class="action-btns">
          <button class="icon-btn" title="แก้ไข" onclick="openEditModal(${r.id})">✏️</button>
          <button class="icon-btn del" title="ลบ" onclick="confirmDelete(${r.id})">🗑️</button>
        </div>
      </td>
    </tr>
  `).join('');

  // Pagination
  const paginationEl = document.getElementById('pagination');
  if (pages <= 1) { paginationEl.innerHTML = `<div class="page-info">แสดง ${total} รายการ</div>`; return; }
  let pageBtns = '';
  for (let p = 1; p <= pages; p++) {
    pageBtns += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  }
  paginationEl.innerHTML = `
    <div class="page-info">แสดง ${start+1}–${Math.min(start+PAGE_SIZE,total)} จาก ${total} รายการ</div>
    <div class="page-btns">
      <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>
      ${pageBtns}
      <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>
    </div>
  `;
}

function goPage(p) { currentPage = p; renderTable(); }

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('searchInput').value = '';
  document.getElementById('filterZone').value = '';
  document.getElementById('filterStatus').value = '';
  currentPage = 1;
  updateStats();
  updateResponsibleFilter();
  applyFilters();
}

function openAddModal() {
  editId = null;
  document.getElementById('modalTitle').textContent = '➕ เพิ่มรายการใหม่';
  ['f_machine','f_zone','f_product','f_supplier','f_problem','f_solution','f_pr','f_budget','f_responsible','f_deadline','f_duration','f_remark'].forEach(id => {
    const el = document.getElementById(id);
    el.value = id === 'f_status' ? 'รอดำเนินการ' : '';
  });
  document.getElementById('f_status').value = 'รอดำเนินการ';
  document.getElementById('formModal').classList.add('open');
}
function openEditModal(id) {
  const r = (data[currentTab]||[]).find(x => x.id === id);
  if (!r) return;
  editId = id;
  document.getElementById('modalTitle').textContent = '✏️ แก้ไขรายการ';
  document.getElementById('f_machine').value = r.machine||'';
  document.getElementById('f_zone').value = r.zone||'';
  document.getElementById('f_product').value = r.product||'';
  document.getElementById('f_supplier').value = r.supplier||'';
  document.getElementById('f_problem').value = r.problem||'';
  document.getElementById('f_solution').value = r.solution||'';
  document.getElementById('f_pr').value = r.pr||'';
  document.getElementById('f_budget').value = r.budget||'';
  document.getElementById('f_status').value = r.status||'รอดำเนินการ';
  document.getElementById('f_responsible').value = r.responsible||'';
  document.getElementById('f_deadline').value = r.deadline||'';
  document.getElementById('f_duration').value = r.duration||'';
  document.getElementById('f_remark').value = r.remark||'';
  document.getElementById('formModal').classList.add('open');
}
function closeModal() { document.getElementById('formModal').classList.remove('open'); }

function saveRecord() {
  const machine = document.getElementById('f_machine').value.trim();
  const problem = document.getElementById('f_problem').value.trim();
  if (!machine) { showToast('กรุณากรอกชื่อเครื่องจักร', 'error'); return; }
  const record = {
    machine, zone: document.getElementById('f_zone').value,
    product: document.getElementById('f_product').value.trim(),
    supplier: document.getElementById('f_supplier').value.trim(),
    problem, solution: document.getElementById('f_solution').value.trim(),
    pr: document.getElementById('f_pr').value.trim(),
    budget: document.getElementById('f_budget').value,
    status: document.getElementById('f_status').value,
    responsible: document.getElementById('f_responsible').value.trim(),
    deadline: document.getElementById('f_deadline').value,
    duration: document.getElementById('f_duration').value.trim(),
    remark: document.getElementById('f_remark').value.trim(),
  };
  if (editId !== null) {
    const idx = data[currentTab].findIndex(r => r.id === editId);
    if (idx >= 0) data[currentTab][idx] = { ...data[currentTab][idx], ...record };
    showToast('แก้ไขข้อมูลเรียบร้อย ✓', 'success');
  } else {
    record.id = getNextId(currentTab);
    data[currentTab].push(record);
    showToast('เพิ่มรายการใหม่เรียบร้อย ✓', 'success');
  }
  saveData();
  closeModal();
  updateStats();
  updateResponsibleFilter();
  applyFilters();
}

function confirmDelete(id) {
  deleteId = id;
  document.getElementById('confirmModal').classList.add('open');
  document.getElementById('confirmDeleteBtn').onclick = () => {
    data[currentTab] = (data[currentTab]||[]).filter(r => r.id !== deleteId);
    saveData();
    document.getElementById('confirmModal').classList.remove('open');
    showToast('ลบรายการเรียบร้อย', 'success');
    updateStats();
    updateResponsibleFilter();
    applyFilters();
  };
}

function exportCSV() {
  const arr = filteredData.length ? filteredData : (data[currentTab]||[]);
  const headers = ['ลำดับ','เครื่องจักร','โซน','Product Item','ปัญหา','แนวทางแก้ไข','Supplier','Budget','สถานะ','MEMO/PR','ผู้รับผิดชอบ','กำหนดการ','ระยะเวลา','หมายเหตุ'];
  const rows = arr.map((r,i) => [i+1,r.machine,r.zone,r.product,r.problem,r.solution,r.supplier,r.budget,r.status,r.pr,r.responsible,r.deadline,r.duration,r.remark].map(v => `"${(v||'').toString().replace(/"/g,'""')}"`));
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `spare_parts_${currentTab}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('Export CSV เรียบร้อย ✓', 'success');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Close modals on overlay click
document.getElementById('formModal').addEventListener('click', e => { if(e.target === e.currentTarget) closeModal(); });
document.getElementById('confirmModal').addEventListener('click', e => { if(e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });

loadData();
updateStats();
updateResponsibleFilter();
applyFilters();
</script>
</body>
</html>
